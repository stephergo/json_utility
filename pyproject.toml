[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "data-sync"
version = "0.1.0"
description = "A library to synchronize data between JSON, Excel, and a database."
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "pandas",
    "openpyxl",
    "sqlalchemy",
    "duckdb-engine", # DuckDB driver for SQLAlchemy
    "duckdb"
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[project.urls]
"Homepage" = "https://github.com/pypa/sampleproject" # Placeholder
"Bug Tracker" = "https://github.com/pypa/sampleproject/issues" # Placeholder
